name: Sustainable development tracker

on:
  schedule:
    # GitHub uses UTC. This is approx 7:20am Melbourne (depending on DST).
    - cron: "20 20 */2 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run agent
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AGENT_TZ: ${{ secrets.AGENT_TZ }}
        run: python -m src.main

      - name: Commit state.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add state.json || true

          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update tracker state"
            git push
          fi
